name: CI/CD WeatherNow

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend:
    name: API (FastAPI) - tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install allure-pytest
      - name: Vérifier que le code se compile
        run: python -m compileall .
      - name: Lancer les tests
        run: pytest tests/ --alluredir=allure-results
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: test-secret-key-for-ci
          OWM_API_KEY: fake-key-for-ci
      - name: Push Allure results
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        # Figé le 24/09/2026 sur un SHA complet : l'action reçoit la clé SSH, et @main lui ferait
        # exécuter tout nouveau commit de gotyeah-allure. Ce SHA exige les clés d'hôte du Pi,
        # passées par secret (en clair dans ce dépôt public, elles trahiraient l'adresse du Pi).
        uses: gchuinard/gotyeah-allure/actions/push-allure-results@8df4d1f7f8dbc77ccc585c58b00b8cb7733c20fc
        with:
          site: gotyeah-meteo
          results-dir: backend/allure-results
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
          ssh-key: ${{ secrets.SSH_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

  frontend:
    name: Front (Next.js) - lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  deploy:
    name: Deploy sur le Pi
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Vérifier que l'empreinte du Pi est configurée
        env:
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          if [ -z "$SSH_HOST_FINGERPRINT" ]; then
            echo "::error::Secret SSH_HOST_FINGERPRINT absent : sans lui, le déploiement accepterait n'importe quel hôte."
            exit 1
          fi
      - name: Déployer sur le Raspberry Pi via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          # Empreinte SHA256 de la clé d'hôte ECDSA du Pi (celle que négocie l'action), depuis le
          # 24/09/2026. Sans elle, l'action accepte n'importe quel hôte : l'étape précédente refuse
          # donc de continuer si le secret est vide.
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          script: |
            cd /home/pi/sites/gotyeah-meteo
            git pull
            # --wait : la commande échoue (et le job CI aussi) si un conteneur ne devient pas sain
            docker compose -f docker-compose.yml --env-file .env up -d --build --force-recreate --wait
