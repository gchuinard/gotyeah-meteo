services:
  weathernow-db:
    # Limite posee le 28/08/2026, sur trois fois la consommation observee.
    # Elle etait deja appliquee a chaud par docker update ; elle est ecrite ici
    # pour survivre a une recreation du conteneur.
    mem_limit: 128m
    image: postgres:16-alpine
    container_name: weathernow-db
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - weathernow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weathernow-net

  weathernow-api:
    # Limite posee le 28/08/2026 a 128m, relevee a 256m le 24/09/2026 : le pic
    # mesure depuis la recreation atteignait deja les 128m. Elle est ecrite ici
    # pour survivre a une recreation du conteneur.
    mem_limit: 256m
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weathernow-api
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      weathernow-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - weathernow-net

  weathernow-front:
    # Limite posee le 28/08/2026, sur trois fois la consommation observee.
    # Elle etait deja appliquee a chaud par docker update ; elle est ecrite ici
    # pour survivre a une recreation du conteneur.
    mem_limit: 512m
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: weathernow-front
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - weathernow-api
    networks:
      - weathernow-net

networks:
  weathernow-net:
    name: weathernow-net
    external: true

volumes:
  weathernow-db-data:
